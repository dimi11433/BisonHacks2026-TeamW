<!doctype html>
<html>
  <head>
    <title>AR Vision</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #camera {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* HUD overlays */
      #status {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: #0f0;
        font-family: monospace;
        font-size: 1em;
        background: rgba(0, 0, 0, 0.5);
        padding: 6px 16px;
        border-radius: 20px;
        border: 1px solid #0f04;
      }

      #btn {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 1.1em;
        padding: 14px 40px;
        background: #0f0;
        color: #111;
        border: none;
        cursor: pointer;
        border-radius: 30px;
        font-family: monospace;
        font-weight: bold;
        box-shadow: 0 0 20px #0f08;
      }
      #btn.active {
        background: #f44;
        color: #fff;
        box-shadow: 0 0 20px #f448;
      }
      #btn:disabled {
        background: #333;
        color: #666;
        cursor: default;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <img id="camera" src="" alt="camera feed" />
    <div id="status">⬤ Connecting...</div>
    <button id="btn" onclick="toggle()" disabled>🎙 Start Talking</button>

    <script>
      let ws,
        active = false,
        audioCtx,
        processor,
        stream,
        gainNode;
      let spkCtx,
        nextTime = 0,
        lastAudioTime = 0;

      function connect() {
        const proto = location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(`${proto}://${location.host}/ws`);

        ws.onmessage = (e) => {
          const d = JSON.parse(e.data);
          if (d.frame)
            document.getElementById("camera").src =
              "data:image/jpeg;base64," + d.frame;
          const btn = document.getElementById("btn");
          document.getElementById("status").textContent = d.connected
            ? "🟢 Gemini Live"
            : "🔴 Connecting...";
          btn.disabled = !d.connected;
          if (d.audio) play(d.audio);
        };

        ws.onclose = () => {
          document.getElementById("status").textContent = "🔴 Disconnected";
          setTimeout(connect, 2000);
        };
      }

      function play(b64) {
        if (!spkCtx) spkCtx = new AudioContext({ sampleRate: 24000 });
        if (spkCtx.state === "suspended") spkCtx.resume();
        const raw = atob(b64);
        const i16 = new Int16Array(raw.length / 2);
        for (let i = 0; i < i16.length; i++)
          i16[i] = raw.charCodeAt(i * 2) | (raw.charCodeAt(i * 2 + 1) << 8);
        const f32 = new Float32Array(i16.length);
        for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
        const buf = spkCtx.createBuffer(1, f32.length, 24000);
        buf.copyToChannel(f32, 0);
        const src = spkCtx.createBufferSource();
        src.buffer = buf;
        src.connect(spkCtx.destination);
        const now = spkCtx.currentTime;
        if (nextTime < now || now - lastAudioTime > 0.5) nextTime = now + 0.05;
        src.start(nextTime);
        nextTime += buf.duration;
        lastAudioTime = now;
      }

      async function toggle() {
        active ? stop() : await start();
      }

      async function start() {
        if (!audioCtx) {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              sampleRate: 16000,
              channelCount: 1,
              echoCancellation: true,
              noiseSuppression: true,
            },
          });
          audioCtx = new AudioContext({ sampleRate: 16000 });
          const src = audioCtx.createMediaStreamSource(stream);
          gainNode = audioCtx.createGain();
          processor = audioCtx.createScriptProcessor(4096, 1, 1);
          processor.onaudioprocess = (e) => {
            if (!active || ws.readyState !== WebSocket.OPEN) return;
            const f32 = e.inputBuffer.getChannelData(0);
            const i16 = new Int16Array(f32.length);
            for (let i = 0; i < f32.length; i++)
              i16[i] = Math.max(-32768, Math.min(32767, f32[i] * 32767));
            ws.send(
              JSON.stringify({
                type: "mic",
                data: btoa(String.fromCharCode(...new Uint8Array(i16.buffer))),
              }),
            );
          };
          src.connect(gainNode);
          gainNode.connect(processor);
          processor.connect(audioCtx.destination);
        }

        if (audioCtx.state === "suspended") await audioCtx.resume();
        active = true;
        const btn = document.getElementById("btn");
        btn.textContent = "🔴 Stop";
        btn.classList.add("active");
      }

      function stop() {
        active = false;
        const btn = document.getElementById("btn");
        btn.textContent = "🎙 Start Talking";
        btn.classList.remove("active");
      }

      connect();
    </script>
  </body>
</html>
